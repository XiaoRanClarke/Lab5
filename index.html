<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frame & BLOOM | Photography</title>
  <meta name="description" content="Professional photography capturing life's most meaningful moments.">

  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-[#f8f6f1] text-[#292722]">

  <!-- NAVIGATION -->
  <header class="px-6 md:px-16 py-7 flex justify-between items-center border-b border-[#e8e3da]">
    <a href="#home" class="text-xl md:text-2xl tracking-[0.18em] font-semibold">
      FRAME & BLOOM
    </a>
  </header>

  <!-- HERO SECTION -->
  <main>
    <section id="home" class="px-6 md:px-16 py-16 md:py-24">
      <div class="grid md:grid-cols-2 gap-12 items-center">

        <div>
          <p class="uppercase tracking-[0.3em] text-xs text-[#94795d] mb-6">
            Photography • Creativity • Memories
          </p>

          <h1 class="text-5xl md:text-7xl font-light leading-tight mb-8">
            Every moment
            <span class="italic text-[#a17d5c]">deserves</span>
            to be remembered.
          </h1>

          <p class="text-[#77736c] leading-8 max-w-lg mb-9">
            Capturing beautiful moments through a creative lens.
            From unforgettable portraits to life's little details,
            every photograph tells a story.
          </p>

          <a href="#portfolio"
             class="inline-block bg-[#292722] text-white px-9 py-4 text-sm tracking-widest hover:bg-[#a17d5c] transition">
            EXPLORE MY WORK
          </a>
        </div>

        <div>
          <img
            src="image1.JPG">
        </div>

      </div>
    </section>

  <!-- FOOTER -->
  <footer class="bg-[#292722] border-t border-[#555149] text-center text-[#d0ccc5] px-6 py-8">
    <p class="tracking-[0.2em] text-sm">FRAME & FOCUS</p>
    <p class="text-xs mt-3">© 2026 Frame & Focus </p>
  </footer>

</body>
</html>
